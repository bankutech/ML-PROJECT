<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TruthLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      min-height: 280px;
      font-family: 'Inter', system-ui, sans-serif;
      background: #0d0f14;
      color: #e8eaf0;
      overflow: hidden;
    }

    /* ── Gradient blob background ── */
    .bg-blob {
      position: fixed;
      top: -60px; left: -60px;
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(99,102,241,0.22) 0%, transparent 70%);
      pointer-events: none;
    }
    .bg-blob2 {
      position: fixed;
      bottom: -40px; right: -40px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(16,185,129,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 18px 18px 14px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #6366f1, #10b981);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      box-shadow: 0 2px 10px rgba(99,102,241,0.4);
    }
    .logo-text {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #a5b4fc, #6ee7b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .pill-active {
      font-size: 10px;
      font-weight: 600;
      background: rgba(16,185,129,0.15);
      color: #34d399;
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 20px;
      padding: 3px 9px;
      letter-spacing: 0.03em;
    }
    .pill-inactive {
      font-size: 10px;
      font-weight: 600;
      background: rgba(255,255,255,0.06);
      color: #888;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 3px 9px;
    }

    /* ── Stats grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 500;
      color: #9ca3af;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .stat-value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .val-neutral  { color: #e8eaf0; }
    .val-danger   { color: #f87171; }
    .val-success  { color: #34d399; }
    .val-warning  { color: #fbbf24; }

    /* ── Page credibility bar ── */
    .cred-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .cred-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .cred-title {
      font-size: 11px;
      font-weight: 500;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .cred-pct {
      font-size: 13px;
      font-weight: 700;
    }
    .progress-track {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    /* ── Toggle row ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px;
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: #d1d5db;
    }
    .switch {
      position: relative;
      width: 42px; height: 24px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      transition: background 0.3s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    input:checked + .slider { background: #10b981; }
    input:checked + .slider::before { transform: translateX(18px); }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 10px;
      color: #4b5563;
    }
    .dot {
      width: 5px; height: 5px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Model status ── */
    .model-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #6b7280;
      margin-top: 6px;
    }
    .model-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-loading { background: #fbbf24; animation: pulse 1s infinite; }
    .dot-ready   { background: #34d399; }
    .dot-error   { background: #f87171; }
  </style>
</head>
<body>
  <div class="bg-blob"></div>
  <div class="bg-blob2"></div>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="logo-wrap">
        <div class="logo-icon">🔍</div>
        <span class="logo-text">TruthLens</span>
      </div>
      <span class="pill-active" id="status-pill">● ACTIVE</span>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Scanned</div>
        <div class="stat-value val-neutral" id="images-scanned">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Deepfakes</div>
        <div class="stat-value val-danger" id="deepfakes-detected">–</div>
      </div>
    </div>

    <!-- Page credibility -->
    <div class="cred-card">
      <div class="cred-header">
        <span class="cred-title">Page Credibility</span>
        <span class="cred-pct" id="cred-pct" style="color:#9ca3af">Scanning…</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="cred-bar" style="width:0%;background:#4b5563"></div>
      </div>
    </div>

    <!-- Enable toggle -->
    <div class="toggle-row">
      <span class="toggle-label">Scan this site</span>
      <label class="switch">
        <input type="checkbox" checked id="toggle-extension">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Model status -->
    <div class="model-status">
      <span class="model-dot dot-ready" id="model-dot"></span>
      <span id="model-status-text">All analysis runs 100% locally · No data sent</span>
    </div>

    <!-- Footer -->
    <div class="footer" style="margin-top:10px;">
      <div class="dot"></div>
      <span>TruthLens v1.0 · Open source · Privacy-first</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
